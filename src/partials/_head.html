<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="canonical" href="{{CANONICAL}}" />

<!-- Display serif carries headlines above the fold — preload so H1 paints
     without a swap. Body/UI is Arial (system), so no body-font fetch. The
     Hamilton @ glyph renders as an ENVELOPE — every email / handle / URL on
     this site is set in Arial via .is-address, never a Hamilton face. -->
<link rel="preload" href="/assets/fonts/TCHamiltonArc-Rg.otf" as="font" type="font/otf" crossorigin />

<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
<link rel="icon" href="/assets/icon-512.png" sizes="512x512" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta property="og:url" content="{{OG_URL}}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="/styles.css" />
{{EXTRA_HEAD}}
