<!-- ===================== COOKIE CONSENT (§7) =====================
     Cream strip, bottom, above the mobile CTA. Choice persists in
     localStorage (otoro.cookieConsent); analytics load only after Accept.
     Hidden by default; script.js reveals it when no choice is stored. -->
<div class="cookiebar" id="cookiebar" role="dialog" aria-label="Cookie preferences" aria-live="polite" hidden>
  <p class="cookiebar-text">We use a small set of cookies to understand how the site is used. You can decline non-essential cookies, manage them, or accept.</p>
  <div class="cookiebar-actions">
    <button type="button" class="btn btn--sm btn--quiet" data-cookie="decline">Decline</button>
    <a class="btn btn--sm btn--quiet" href="/legal/cookies" data-cookie="manage">Manage</a>
    <button type="button" class="btn btn--sm" data-cookie="accept">Accept</button>
  </div>
</div>
