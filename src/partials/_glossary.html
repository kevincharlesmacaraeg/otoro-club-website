<!-- ===================== SUSHI GLOSSARY (flyout) =====================
     Mounted globally by build.mjs, so it exists on every route.

     Trigger is a vertical rail tab on the right edge — the same
     writing-mode/letterspacing language as .rail, and it deliberately
     avoids the bottom edge where .cookiebar lives.

     Content is hardcoded below as JSON (#glossaryData). script.js parses
     it once and renders the panel body; nothing is fetched. Definitions
     may carry <em> and are injected as HTML — the data is authored here,
     never user input. Search matches term + kanji + tag-stripped
     definition. -->

<button type="button" class="gl-tab" id="glossaryTab" aria-expanded="false" aria-controls="glossaryPanel">
  <span class="gl-tab-text">Glossary</span>
</button>

<div class="gl-backdrop" id="glossaryBackdrop" inert></div>

<aside class="gl-panel" id="glossaryPanel" role="dialog" aria-modal="true" aria-labelledby="glossaryTitle" inert>
  <div class="gl-head">
    <div class="gl-head-row">
      <div>
        <p class="gl-label">Reference</p>
        <h2 class="display gl-title" id="glossaryTitle">Sushi Glossary</h2>
      </div>
      <button type="button" class="gl-close" id="glossaryClose" aria-label="Close the glossary">
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>

    <p class="gl-intro">A counter-side reference to the words worth knowing &mdash; the formats, the fish, the technique, and the etiquette.</p>

    <div class="gl-search-row">
      <label class="gl-sr-only" for="glossarySearch">Search the glossary</label>
      <input type="search" id="glossarySearch" class="gl-search" placeholder="Search a term, kanji, or meaning" autocomplete="off" spellcheck="false" />
      <button type="button" class="gl-clear" id="glossaryClear" aria-label="Clear search" hidden>Clear</button>
    </div>

    <nav class="gl-jump" id="glossaryJump" aria-label="Glossary categories"></nav>
  </div>

  <div class="gl-body" id="glossaryBody" tabindex="-1"></div>
</aside>
